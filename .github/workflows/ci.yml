name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history

      # First, so build/test failures can't skip it.
      - name: Scan for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Build image
        run: |
          docker build -t maple-remit:${{ github.sha }} .
          docker save -o image.tar maple-remit:${{ github.sha }}

      - name: Smoke test image
        run: |
          docker run -d --name smoke -p 8080:8080 maple-remit:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Scan image (Trivy, fail on CRITICAL)
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/aquasecurity/trivy:0.75.0 \
            image --input /work/image.tar --scanners vuln --severity CRITICAL --exit-code 1 --no-progress

      - name: Upload scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: image

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tagged with commit SHA
        run: |
          docker load -i image.tar
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}"
          docker tag maple-remit:${{ github.sha }} "$image"
          docker push "$image"
