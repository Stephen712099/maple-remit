services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mapleremit
      POSTGRES_USER: mapleremit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # TCP: the init server only listens on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mapleremit -d mapleremit"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      Storage__Provider: Postgres
      ConnectionStrings__Postgres: Host=db;Database=mapleremit;Username=mapleremit;Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
